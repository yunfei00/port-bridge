[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-bridge"
version = "0.1.0"
description = "Cross-platform TCP forwarding, VISA bridging, and reverse tunneling tool"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
visa = ["pyvisa>=1.14"]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.4"]

[project.scripts]
port-bridge = "port_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
